<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서류점검항목</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: header + meter; two columns: left = 분류(카탈로그, Firebase에 저장) sticky, right = 서류 목록 with 담당자·비고·링크. Bottom: fixed sheet-style tab bar.
   Roles: admin(전체 권한) vs viewer(비고/링크/필터만) — enforced client-side (CSS/JS) AND server-side (Firebase rules). */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#dfe3df;
  --accent:#2f5d50; --accent-soft:#e3ece8;
  --ok:#2e7d4f; --ok-soft:#e2f2e8; --warn:#b4610b; --warn-soft:#fbeedd; --na:#7b837e; --na-soft:#eceeec;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141816; --panel:#1c211f; --fg:#e4e9e6; --muted:#98a39d; --line:#2e3532;
  --accent:#8cc4b1; --accent-soft:#23332d;
  --ok:#6fcf97; --ok-soft:#1d3226; --warn:#f0a95a; --warn-soft:#3a2a17; --na:#a2aaa5; --na-soft:#262c29; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:24px 120px}
h1{font-size:1.5rem;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 .tn{color:var(--accent);font-weight:600}
.sub{color:var(--muted);margin:.2rem 0 0;font-size:.88rem}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.save{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.save .st{display:flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--na);display:inline-block}
.save.on i{background:var(--ok)} .save.off i{background:var(--warn)}
.who{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.rolebadge{font-size:.68rem;font-weight:700;border-radius:8px;padding:0 6px;background:var(--accent-soft);color:var(--accent)}
.signout{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;font:inherit;font-size:.76rem;cursor:pointer}
.signout:hover{border-color:var(--muted);color:var(--fg)}
.sum{margin-top:14px;display:grid;gap:8px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.meter span{display:block;height:100%}
.m-ok{background:var(--ok)} .m-na{background:var(--na)} .m-warn{background:var(--warn)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);align-items:baseline}
.stats b{font-family:var(--f-mono);font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.stats .pct{font-size:1.3rem;font-family:var(--f-mono);color:var(--accent);margin-right:4px}
.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
.main{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.mh{padding:14px 16px 12px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.mh-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.mh h2{margin:0;font-size:1.15rem;font-weight:700}
.mh .cnt{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 10px;font:inherit;font-size:.8rem;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
input[type=search],input[type=text],select{min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);padding:5px 10px;font:inherit;font-size:.85rem}
input[type=search]{flex:1 1 160px}
select{flex:none;max-width:170px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:11px 16px 11px 13px;border-left:3px solid transparent}
li+li{border-top:1px solid var(--line)}
li .nm{min-width:0;flex:1 1 220px}
li .nm small{display:block;color:var(--muted);font-size:.75rem}
li[data-s="done"]{border-left-color:var(--ok)} li[data-s="done"] .nm{color:var(--muted)}
li[data-s="fix"]{border-left-color:var(--warn);background:var(--warn-soft)}
li[data-s="na"]{border-left-color:var(--na)} li[data-s="na"] .nt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.nm .nt{margin-right:8px}
.ptog{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:0 8px;font:inherit;font-size:.72rem;line-height:1.6;cursor:pointer;vertical-align:1px}
.ptog:hover{border-color:var(--muted);color:var(--fg)}
.ptog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.ptog.arm{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);font-weight:600}
.st{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.st .pn{font-family:var(--f-mono);font-size:.72rem}
.proc{display:inline-flex;flex-wrap:wrap;gap:3px;padding:2px;border:1px dashed var(--accent);border-radius:8px}
.st .proc button{padding:2px 8px;font-size:.76rem}
.st .proc button[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.st .proc button[aria-pressed="true"]::before{content:"✓ "}
.st button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;padding:4px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.st button:hover{border-color:var(--muted)}
.st button[data-v="done"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--panel);font-weight:600}
.st button[data-v="fix"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--panel);font-weight:600}
.st button[data-v="na"][aria-pressed="true"]{background:var(--na);border-color:var(--na);color:var(--panel);font-weight:600}
.memos{flex:1 1 100%;display:grid;gap:4px;min-width:0}
.memo{display:flex;align-items:center;gap:6px;min-width:0}
.memo label,.memo .sp{font-size:.75rem;color:var(--muted);flex:none;width:2.2em}
.memo input{flex:1;width:100%;padding:4px 8px;font-size:.84rem;background:var(--bg)}
.memo input:not(:placeholder-shown){background:var(--panel);border-color:var(--muted)}
.abadge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ac,var(--muted));color:var(--ac,var(--muted));background:none;border-radius:10px;padding:0 8px;font:inherit;font-size:.72rem;font-weight:600;line-height:1.6;vertical-align:1px;white-space:nowrap}
button.abadge{cursor:pointer}
button.abadge:hover{opacity:.8}
.aedit{display:inline-flex;align-items:center;gap:4px;vertical-align:1px}
.aedit input[type=text]{width:120px;padding:2px 6px;font-size:.78rem}
.aedit input[type=color]{width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.aeditmulti{display:inline-flex;flex-direction:column;align-items:flex-start;gap:4px;vertical-align:middle;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px}
.arow{display:inline-flex;align-items:center;gap:4px}
.mdel{flex:none;width:26px;height:26px;border:1px solid transparent;background:none;color:var(--muted);border-radius:6px;font:inherit;font-size:1rem;line-height:1;cursor:pointer}
.mdel:hover{border-color:var(--line);color:var(--warn)}
.madd{justify-self:start;margin-left:calc(2.2em + 6px);border:1px dashed var(--line);background:none;color:var(--muted);border-radius:6px;padding:2px 10px;font:inherit;font-size:.76rem;cursor:pointer}
.madd:hover{border-color:var(--muted);color:var(--fg)}
.memo.link input{font-family:var(--f-mono);font-size:.78rem}
.mini{flex:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:1px 8px;font:inherit;font-size:.72rem;cursor:pointer}
.mini:hover{border-color:var(--muted);color:var(--fg)}
.empty{padding:22px 16px;color:var(--muted);font-size:.88rem}
.mf{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.nav{border:1px solid var(--line);background:none;color:var(--fg);border-radius:6px;padding:5px 10px;font:inherit;font-size:.82rem;cursor:pointer}
.nav:hover{border-color:var(--muted)}
.nav[disabled]{visibility:hidden}
.side{order:-1;position:sticky;top:12px;display:grid;gap:6px;min-width:0}
.side h3{margin:0 0 2px;font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.06em}
.cat{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:inherit;cursor:pointer}
.cat:hover{border-color:var(--muted)}
.cat[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.cat .cn{font-size:.9rem;font-weight:600;min-width:0}
.cat .cc{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.cat .meter{grid-column:1/-1;height:4px}
.flag{color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:0 6px;font-family:var(--f-body);font-size:.7rem;font-weight:600}
.fin{color:var(--ok);background:var(--ok-soft);border-radius:10px;padding:0 6px;font-family:var(--f-body);font-size:.7rem;font-weight:600}
.foot{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:5px 10px;font:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted);color:var(--fg)}
.btn.arm{border-color:var(--warn);color:var(--warn);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.itemadd{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:6px;padding:4px 10px;font:inherit;font-size:.78rem;cursor:pointer}
.itemadd:hover{border-color:var(--muted);color:var(--fg)}
.itemform{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.itemform input{flex:1 1 160px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabrow{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px;overflow-x:auto}
.tab{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg);border-color:var(--muted)}
.tab[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.tab small{font-family:var(--f-mono);font-size:.72rem;opacity:.8}
.tabform{flex:none;display:flex;gap:6px;align-items:center}
.tabform input{width:180px}
.tabmsg{flex:none;font-size:.78rem;color:var(--warn)}
.tabact{margin-left:auto;flex:none;display:flex;gap:6px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.viewer .tabedit,body.viewer .reset,body.viewer .itemadd,body.viewer .itemform{display:none!important}
body.viewer button.abadge{pointer-events:none;cursor:default}
body.viewer .st button,body.viewer .ptog,body.viewer .proc button{pointer-events:none;opacity:.7}
@media (max-width:760px){
  .cols{grid-template-columns:1fr}
  .side{position:static;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .side h3{grid-column:1/-1}
  .cat{padding:8px 10px}
  .cat .cn{font-size:.82rem}
  .tabact{margin-left:0}
}
/* auth screens */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 28px;max-width:360px;width:100%;text-align:center;display:grid;gap:14px}
.card h1{font-size:1.2rem}
.card p{color:var(--muted);font-size:.88rem;margin:0}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:10px 18px;font:inherit;font-size:.92rem;font-weight:600;cursor:pointer}
.gbtn:hover{border-color:var(--muted)}
.gbtn svg{width:18px;height:18px}
.denied{color:var(--warn);font-size:.85rem}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

];

function colorKey(name){return String(name).replace(/[.#$\[\]\/]/g,"_")}
function colorOf(name){return (name&&COLOR_BY_NAME[name])||null}
var ui=(function(){try{return JSON.parse(localStorage.getItem("cl26-ui5"))||{}}catch(e){return{}}})();

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function groupArr(){var ids=Object.keys(CAT||{});return ids.map(function(id){var g=CAT[id]||{};return {id:id,name:g.name,order:g.order,items:g.items}}).sort(function(a,b){return (a.order||0)-(b.order||0)})}
function itemArr(g){var ids=Object.keys((g&&g.items)||{});return ids.map(function(id){var it=(g.items&&g.items[id])||{};return {id:id,name:it.name,order:it.order,assignee:it.assignee,assignees:it.assignees}}).sort(function(a,b){return (a.order||0)-(b.order||0)})}
function allItems(){var out=[];groupArr().forEach(function(g){itemArr(g).forEach(function(it){out.push({group:g,item:it})})});return out}
function assigneesOf(it){return (it.assignees&&it.assignees.length)?it.assignees:(it.assignee?[it.assignee]:[])}
function assigneeList(){var set={};allItems().forEach(function(x){assigneesOf(x.item).forEach(function(a){a=(a||"").trim();if(a)set[a]=true})});return Object.keys(set).sort()}
function tabList(){var ids=Object.keys(S||{});ids.sort(function(a,b){return (S[a].order||0)-(S[b].order||0)});return ids}
function cur(){var ids=tabList();if(!ids.length)return null;if(ids.indexOf(ui.t)<0)ui.t=ids[0];return S[ui.t]}
function counts(T,arr){var c={done:0,fix:0,na:0,none:0};arr.forEach(function(it){c[(T.s&&T.s[it.id])||"none"]++});c.t=arr.length;return c}
function meter(c){var t=c.t||1;return '<div class="meter"><span class="m-ok" style="width:'+(c.done/t*100)+'%"></span><span class="m-na" style="width:'+(c.na/t*100)+'%"></span><span class="m-warn" style="width:'+(c.fix/t*100)+'%"></span></div>'}
function pctOf(T){var all=allItems().map(function(x){return x.item});var c=counts(T,all);return Math.round((c.done+c.na)/(c.t||1)*100)}

/* ---------- Firebase writes ---------- */
function immediate(path,val){db.ref(path).set(val).catch(function(e){console.error(e)})}
function markDirty(path,val){dirty[path]=val;clearTimeout(flushTimer);flushTimer=setTimeout(flushDirty,700)}
function flushDirty(){var u=dirty;dirty={};clearTimeout(flushTimer);if(Object.keys(u).length)db.ref().update(u).catch(function(e){console.error(e)})}
window.addEventListener("beforeunload",flushDirty);
window.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")flushDirty()});

function setStatus(tabId,itemId,v){if(!isAdmin(meEmail))return;var T=S[tabId];T.s=T.s||{};var nv=T.s[itemId]===v?null:v;
 if(nv===null)delete T.s[itemId];else T.s[itemId]=nv;
 var P=T.p&&T.p[itemId];
 if(P&&P.on){P.c=nv==="done"?PROCS.slice():[]}
 render();
 immediate("tabs/"+tabId+"/s/"+itemId,nv);
 if(P)immediate("tabs/"+tabId+"/p/"+itemId+"/c",P.c&&P.c.length?P.c:null);
}
function toggleProcOn(tabId,itemId){if(!isAdmin(meEmail))return;var T=S[tabId];T.p=T.p||{};var P=T.p[itemId]||{on:false,c:[]};
 if(P.on){
  if(P.c&&P.c.length)return; // 공정이 하나라도 체크된 동안은 해제 불가
  delete T.p[itemId];render();immediate("tabs/"+tabId+"/p/"+itemId,null);return;
 }
 P.on=true;
 if(T.s&&T.s[itemId]==="done")P.c=PROCS.slice();
 T.p[itemId]=P;
 render();
 immediate("tabs/"+tabId+"/p/"+itemId,P);
}
function toggleProcItem(tabId,itemId,proc){if(!isAdmin(meEmail))return;var T=S[tabId];T.p=T.p||{};T.s=T.s||{};var P=T.p[itemId]||{on:true,c:[]};var idx=P.c.indexOf(proc);
 if(idx>=0)P.c.splice(idx,1);else P.c.push(proc);
 T.p[itemId]=P;
 if(P.c.length===PROCS.length)T.s[itemId]="done";else if(T.s[itemId]==="done")delete T.s[itemId];
 render();
 immediate("tabs/"+tabId+"/p/"+itemId,P);

function submitTab(){
 if(!isAdmin(meEmail))return;

 if(!name){tabMsg="이름을 입력하세요";render();return}
 var ids=tabList();
 var dup=ids.some(function(id){return S[id].name===name&&!(tabForm==="rename"&&id===ui.t)});
 if(dup){tabMsg="같은 이름의 탭이 이미 있습니다";render();return}
 if(tabForm==="new"){
  var id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var maxOrder=-1;ids.forEach(function(x){if((S[x].order||0)>maxOrder)maxOrder=S[x].order||0});

 }else{
  immediate("tabs/"+ui.t+"/name",name);
 }

  h+='<div class="mf"><button class="nav" data-go="'+(ui.g-1)+'"'+(ui.g===0?' disabled':'')+'>← '+(ui.g>0?esc(groups[ui.g-1].name):'')+'</button><button class="nav" data-go="'+(ui.g+1)+'"'+(ui.g===groups.length-1?' disabled':'')+'>'+(ui.g<groups.length-1?esc(groups[ui.g+1].name):'')+' →</button></div>';
 }
 var filtered=!!ui.af||ui.f!=="all";
 h+='</section><nav class="side" aria-label="서류 분류"><h3>분류'+(filtered?' (필터 적용됨)':'')+'</h3>';
 var anyMatch=false;
 groups.forEach(function(G,gi){
  var baseItems=itemArr(G);
  var k=filtered?counts(T,baseItems.filter(function(it){return match(T,it)})):counts(T,baseItems);
  if(filtered&&!k.t)return;

  h+='<button class="cat" data-g="'+gi+'" aria-current="'+(!q&&gi===ui.g)+'"><span class="cn">'+esc(G.name)+'</span><span class="cc">'+(k.fix?'<span class="flag">보완 '+k.fix+'</span>':'')+(k.none===0&&k.fix===0?'<span class="fin">끝</span>':'')+(k.done+k.na)+'/'+k.t+'</span>'+meter(k)+'</button>'});
 if(filtered&&!anyMatch)h+='<p class="sub">조건에 맞는 서류가 있는 분류가 없습니다.</p>';
 h+='</nav></div><div class="foot"><span>버튼을 다시 누르면 선택이 해제됩니다. 변경 사항은 실시간으로 모두에게 저장됩니다.</span><button class="btn reset'+(armed==="reset"?' arm':'')+'" id="reset">'+(armed==="reset"?'한 번 더 누르면 이 탭 초기화':'이 탭 초기화')+'</button></div></div>';
 h+='<div class="tabbar"><div class="tabrow" role="tablist" aria-label="점검 탭">';
 tabList().forEach(function(id){h+='<button class="tab" role="tab" data-tab="'+id+'" aria-current="'+(id===tabId)+'">'+esc(S[id].name||"탭")+'<small>'+pctOf(S[id])+'%</small></button>'});
 if(tabForm){h+='<span class="tabform"><input type="text" id="tabname" maxlength="30" placeholder="'+(tabForm==="new"?'새 탭 이름 (예: HACCP)':'바꿀 이름')+'" value="'+(tabForm==="rename"?esc(T.name||""):'')+'" aria-label="탭 이름"><button class="btn pri" id="tabok">'+(tabForm==="new"?'만들기':'변경')+'</button><button class="btn" id="tabcancel">취소</button></span>'+(tabMsg?'<span class="tabmsg">'+esc(tabMsg)+'</span>':'')}
 else h+='<button class="btn tabedit" id="tabnew">+ 탭 추가</button>';
 h+='<span class="tabact"><button class="btn tabedit" id="tabrename">이름 변경</button>'+(tabList().length>1?'<button class="btn tabedit'+(armed==="del"?' arm':'')+'" id="tabdel">'+(armed==="del"?'한 번 더 누르면 "'+esc(T.name||"")+'" 삭제':'탭 삭제')+'</button>':'')+'</span></div></div>';
 var ae=document.activeElement, fid=ae&&ae.id, pos=0; try{pos=ae.selectionStart}catch(e){}

 if(fid==="q"||fid==="tabname"||fid==="itemname"||/^[ml][a-z0-9]+-\d+$/.test(fid||"")){var el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}

/* ---------- Events ---------- */
function pick(i){ui.g=i;q="";saveUi();render();
 var m=document.getElementById("main");if(m&&(m.getBoundingClientRect().top<0||window.innerWidth<=760))m.scrollIntoView({block:"start",behavior:"smooth"})}
function jumpToFirstMatchIfNeeded(){
 var T=cur();if(!T)return;
 if(!(ui.af||ui.f!=="all"))return;
 var groups=groupArr();
 var cur_ok=groups[ui.g]&&itemArr(groups[ui.g]).some(function(it){return match(T,it)});
 if(cur_ok)return;
 var idx=groups.findIndex(function(G){return itemArr(G).some(function(it){return match(T,it)})});
 if(idx>=0)ui.g=idx;
}
function arm(k){armed=k;render();setTimeout(function(){if(armed===k){armed=null;render()}},4000)}
function copyText(t,b){var lbl=b.textContent,done=function(ok){b.textContent=ok?"복사됨":"실패";setTimeout(function(){b.textContent=lbl},1500)};
 var fb=function(){try{var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();done(ok)}catch(x){done(false)}};
 try{navigator.clipboard.writeText(t).then(function(){done(true)},fb)}catch(x){fb()}}

document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.id==="signout"){auth.signOut();return}
 var T=cur();var tabId=ui.t;
 if(b.dataset.item){if(T)setStatus(tabId,b.dataset.item,b.dataset.v);armed=null;return}
 if(b.dataset.ptog!==undefined){if(T)toggleProcOn(tabId,b.dataset.ptog);return}
 if(b.dataset.pitem!==undefined){if(T)toggleProcItem(tabId,b.dataset.pitem,b.dataset.proc);return}
 if(b.dataset.lcopy!==undefined){var Ls=(T&&T.l&&T.l[b.dataset.lcopy])||[];copyText(Ls[+b.dataset.j]||"",b);return}
 if(b.dataset.ladd!==undefined){addLine("l",b.dataset.ladd,-1);return}
 if(b.dataset.ldel!==undefined){if(T)delLine(tabId,"l",b.dataset.ldel,+b.dataset.j);return}
 if(b.dataset.madd!==undefined){addLine("m",b.dataset.madd,-1);return}
 if(b.dataset.mdel!==undefined){if(T)delLine(tabId,"m",b.dataset.mdel,+b.dataset.j);return}
 if(b.dataset.f){ui.f=b.dataset.f;jumpToFirstMatchIfNeeded();saveUi();render();return}
 if(b.dataset.g!==undefined){pick(+b.dataset.g);return}
 if(b.dataset.go!==undefined){pick(+b.dataset.go);return}
 if(b.dataset.tab){ui.t=b.dataset.tab;armed=null;saveUi();render();return}
 if(b.id==="tabnew"||b.id==="tabrename"){if(!isAdmin(meEmail))return;tabForm=b.id==="tabnew"?"new":"rename";tabMsg="";armed=null;render();var el=document.getElementById("tabname");if(el){el.focus();el.select()}return}
 if(b.id==="tabcancel"){tabForm=null;tabMsg="";render();return}
 if(b.id==="tabok"){submitTab();return}
 if(b.id==="tabdel"){if(!isAdmin(meEmail))return;if(armed!=="del"){arm("del");return}armed=null;deleteTab(tabId);return}
 if(b.id==="reset"){if(!isAdmin(meEmail))return;if(armed!=="reset"){arm("reset");return}armed=null;resetTab(tabId);return}
 if(b.id==="itemadd"){if(!isAdmin(meEmail))return;itemForm=true;render();var ie=document.getElementById("itemname");if(ie)ie.focus();return}
 if(b.id==="itemcancel"){itemForm=false;render();return}
 if(b.id==="itemok"){submitItem();return}
 if(b.dataset.aedit!==undefined){if(!isAdmin(meEmail))return;
  var gid=b.dataset.group, iid=b.dataset.aedit;
  var itx=(CAT[gid]&&CAT[gid].items&&CAT[gid].items[iid])||{};
  var nm=assigneesOf(itx);if(!nm.length)nm=[""];
  ASSIGN_DRAFT[iid]=nm.map(function(n){return {name:n,color:colorOf(n)||DEFAULT_ASSIGN_COLOR}});
  editingAssign=iid;render();
  var ni=document.getElementById("an"+iid+"-0");if(ni){ni.focus();ni.select()}return}
 if(b.dataset.acancel!==undefined){delete ASSIGN_DRAFT[b.dataset.acancel];editingAssign=null;render();return}
 if(b.dataset.aaddrow!==undefined){var iid2=b.dataset.aaddrow;syncDraftFromDom(iid2);(ASSIGN_DRAFT[iid2]=ASSIGN_DRAFT[iid2]||[]).push({name:"",color:DEFAULT_ASSIGN_COLOR});render();
  var el2=document.getElementById("an"+iid2+"-"+(ASSIGN_DRAFT[iid2].length-1));if(el2)el2.focus();return}
 if(b.dataset.adelrow!==undefined){var iid3=b.dataset.adelrow,idx=+b.dataset.idx;syncDraftFromDom(iid3);var arr3=ASSIGN_DRAFT[iid3]||[];arr3.splice(idx,1);if(!arr3.length)arr3.push({name:"",color:DEFAULT_ASSIGN_COLOR});ASSIGN_DRAFT[iid3]=arr3;render();return}
 if(b.dataset.asave!==undefined){syncDraftFromDom(b.dataset.asave);saveAssignees(b.dataset.group,b.dataset.asave);return}
 if(b.dataset.nedit!==undefined){if(!isAdmin(meEmail))return;editingItemName=b.dataset.nedit;itemNameMsg="";render();var ni3=document.getElementById("in"+b.dataset.nedit);if(ni3){ni3.focus();ni3.select()}return}
 if(b.dataset.ncancel!==undefined){editingItemName=null;itemNameMsg="";render();return}
 if(b.dataset.nsave!==undefined){saveItemName(b.dataset.group,b.dataset.nsave);return}
 if(b.dataset.ddel!==undefined){if(!isAdmin(meEmail))return;var dkey="delitem:"+b.dataset.ddel;if(armed!==dkey){arm(dkey);return}armed=null;deleteItem(b.dataset.group,b.dataset.ddel);return}
});
document.addEventListener("input",function(e){
 var d=e.target.dataset;
 if(e.target.id==="q"){q=e.target.value.trim();render();return}
 if(e.target.id==="af"){ui.af=e.target.value;jumpToFirstMatchIfNeeded();saveUi();render();return}
 if(d&&d.memo!==undefined){var T=cur();if(!T)return;T.m=T.m||{};var a=(T.m[d.memo]&&T.m[d.memo].length)?T.m[d.memo]:[""];a[+d.j]=e.target.value;T.m[d.memo]=a;
  var path="tabs/"+ui.t+"/m/"+d.memo;var clean=a.filter(function(x){return x.trim()});markDirty(path,clean.length?clean:null);return}
 if(d&&d.link!==undefined){var T2=cur();if(!T2)return;T2.l=T2.l||{};var a2=(T2.l[d.link]&&T2.l[d.link].length)?T2.l[d.link]:[""];a2[+d.j]=e.target.value;T2.l[d.link]=a2;
  var path2="tabs/"+ui.t+"/l/"+d.link;var clean2=a2.filter(function(x){return x.trim()});markDirty(path2,clean2.length?clean2:null);return}
});
document.addEventListener("focusout",function(e){var d=e.target.dataset;if(d&&(d.memo!==undefined||d.link!==undefined))flushDirty()});
document.addEventListener("keydown",function(e){
 if(e.target.id==="tabname"){if(e.key==="Enter"){e.preventDefault();submitTab()}else if(e.key==="Escape"){tabForm=null;tabMsg="";render()}return}
 if(e.target.id==="itemname"){if(e.key==="Enter"){e.preventDefault();submitItem()}else if(e.key==="Escape"){itemForm=false;render()}return}
 var am=(e.target.id||"").match(/^an(.+)-(\d+)$/);
 if(am&&e.target.type==="text"){var itemId=am[1];
  if(e.key==="Enter"){e.preventDefault();var b=document.querySelector('[data-aaddrow="'+itemId+'"]');if(b)b.click()}
  else if(e.key==="Escape"){delete ASSIGN_DRAFT[itemId];editingAssign=null;render()}
  return}
 if(/^in/.test(e.target.id||"")&&e.target.type==="text"){var itemId2=e.target.id.slice(2);
  if(e.key==="Enter"){e.preventDefault();var b2=document.querySelector('[data-nsave="'+itemId2+'"]');if(b2)b2.click()}
  else if(e.key==="Escape"){editingItemName=null;itemNameMsg="";render()}
  return}
 var d=e.target.dataset;if(!d)return;
 if(d.memo!==undefined&&e.key==="Enter"&&!e.isComposing){e.preventDefault();flushDirty();addLine("m",d.memo,+d.j)}
 if(d.link!==undefined&&e.key==="Enter"&&!e.isComposing){e.preventDefault();flushDirty();addLine("l",d.link,+d.j)}
});

/* ---------- Auth UI ---------- */
var gate=document.getElementById("gate"), root=document.getElementById("root");
function showGate(html){root.hidden=true;gate.hidden=false;gate.innerHTML=html}
function showApp(){gate.hidden=true;root.hidden=false}
var GICON='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.4 5.4 2.5 13.2l7.9 6.1C12.3 13 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7C43.9 37.6 46.5 31.6 46.5 24.5z"/><path fill="#FBBC05" d="M10.4 19.3c-.5 1.5-.8 3.1-.8 4.7s.3 3.2.8 4.7l-7.9 6.1C1 31.5 0 27.9 0 24s1-7.5 2.5-10.8l7.9 6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.6l-7.3-5.7c-2 1.4-4.7 2.2-8.2 2.2-6.4 0-11.7-3.5-13.6-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>';
function loginScreen(){
 showGate('<div class="card"><h1>서류점검항목</h1><p>허용된 구글 계정으로 로그인해 주세요.</p><button class="gbtn" id="glogin">'+GICON+'<span>Google로 로그인</span></button></div>');
 document.getElementById("glogin").onclick=function(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(err){
   showGate('<div class="card"><h1>서류점검항목</h1><p class="denied">로그인에 실패했습니다: '+esc(err.message||"")+'</p><button class="gbtn" id="retry">'+GICON+'<span>다시 시도</span></button></div>');
   document.getElementById("retry").onclick=loginScreen;
  });
 };
}
function deniedScreen(email){
 showGate('<div class="card"><h1>서류점검항목</h1><p class="denied">'+esc(email)+' 계정은 접근 권한이 없습니다.</p><p>관리자에게 계정 추가를 요청해 주세요.</p><button class="gbtn" id="switch">'+GICON+'<span>다른 계정으로 로그인</span></button></div>');
 document.getElementById("switch").onclick=function(){auth.signOut().then(loginScreen)};
}
function loadingScreen(){showGate('<div class="card"><div class="spin"></div><p>확인 중…</p></div>')}

var dbListenerOn=false;
function tryShowApp(){if(catalogLoaded&&tabsLoaded&&colorsLoaded){showApp();render()}}
function startListening(){
 if(dbListenerOn)return;dbListenerOn=true;
 db.ref(".info/connected").on("value",function(snap){online=!!snap.val();if(catalogLoaded&&tabsLoaded&&colorsLoaded)render()});
 db.ref("assigneeColors").on("value",function(snap){
  var val=snap.val()||{};var map={};
  Object.keys(val).forEach(function(k){var e=val[k];if(e&&e.name)map[e.name]=e.color});
  COLOR_BY_NAME=map;colorsLoaded=true;tryShowApp();
 },function(err){console.error(err)});
 db.ref("catalog").on("value",function(snap){
  var val=snap.val();
  if((!val||!Object.keys(val).length)&&!catalogSeeded&&isAdmin(meEmail)){
   catalogSeeded=true;
   var updates={};
   SEED_GROUPS.forEach(function(g,gi){var gid="g"+gi;updates["catalog/"+gid+"/name"]=g.n;updates["catalog/"+gid+"/order"]=gi;
    g.i.forEach(function(name,ii){var iid="i"+(gi===0?ii:SEED_GROUPS.slice(0,gi).reduce(function(a,x){return a+x.i.length},0)+ii);
     updates["catalog/"+gid+"/items/"+iid+"/name"]=name;updates["catalog/"+gid+"/items/"+iid+"/order"]=ii;
    });
   });
   db.ref().update(updates).catch(function(e){console.error(e)});
   return;
  }
  CAT=val||{};catalogLoaded=true;tryShowApp();
 },function(err){console.error(err)});
 db.ref("tabs").on("value",function(snap){
  var val=snap.val();
  if((!val||!Object.keys(val).length)&&!tabsSeeded&&isAdmin(meEmail)){
   tabsSeeded=true;
   var id="t"+Date.now().toString(36);
   immediate("tabs/"+id+"/name","기본");
   immediate("tabs/"+id+"/order",0);
   return;
  }
  S=val||{};tabsLoaded=true;tryShowApp();
 },function(err){console.error(err)});
}
function stopListening(){
 db.ref("tabs").off();db.ref("catalog").off();db.ref("assigneeColors").off();db.ref(".info/connected").off();
 dbListenerOn=false;S=null;CAT=null;COLOR_BY_NAME={};catalogLoaded=false;tabsLoaded=false;colorsLoaded=false;tabsSeeded=false;catalogSeeded=false;editingAssign=null;
}

auth.onAuthStateChanged(function(user){
 if(!user){stopListening();loginScreen();return}
 if(ALLOWED_EMAILS.indexOf(user.email)<0){stopListening();deniedScreen(user.email);return}
 meEmail=user.email;loadingScreen();startListening();
});
})();

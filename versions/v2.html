 return["ok",msg||fmt(S.updated)];
}
function row(T,n,grp){var s=T.s[n]||"",id="m"+ALL.indexOf(n);
 var P=T.p[n], on=!!(P&&P.on), pc=on?P.c:[];
 var h='<li data-s="'+s+'"><span class="nm"><span class="nt">'+esc(n)+'</span><button class="ptog" data-ptog="'+esc(n)+'" aria-pressed="'+on+'" title="공정별로 나눠 체크">공정별</button>'+(grp?'<small>'+esc(grp)+'</small>':'')+'</span><span class="st">';
 ["done","fix","na"].forEach(function(v){
  h+='<button data-item="'+esc(n)+'" data-v="'+v+'" aria-pressed="'+(s===v)+'">'+LBL[v]+(v==="done"&&on&&s!=="done"?' <span class="pn">'+pc.length+'/'+PROCS.length+'</span>':'')+'</button>';
  if(v==="done"&&on){h+='<span class="proc" role="group" aria-label="공정별 체크">';PROCS.forEach(function(p){h+='<button data-pitem="'+esc(n)+'" data-proc="'+esc(p)+'" aria-pressed="'+(pc.indexOf(p)>=0)+'">'+esc(p)+'</button>'});h+='</span>'}
 });
 h+='</span><span class="memos">';
 var lines=T.m[n]&&T.m[n].length?T.m[n]:[""];
 lines.forEach(function(v,j){var lid=id+"-"+j;
  h+='<span class="memo">'+(j===0?'<label for="'+lid+'">비고</label>':'<span class="sp"></span>')+'<input type="text" id="'+lid+'" data-memo="'+esc(n)+'" data-j="'+j+'" value="'+esc(v)+'" placeholder="'+(j===0?'메모 입력':'추가 메모')+'" maxlength="300" autocomplete="off">'+(lines.length>1||v?'<button class="mdel" data-mdel="'+esc(n)+'" data-j="'+j+'" aria-label="이 줄 삭제" title="이 줄 삭제">×</button>':'')+'</span>'});
 h+='<button class="madd" data-madd="'+esc(n)+'">+ 줄 추가</button>';
 var Ls=T.l[n]&&T.l[n].length?T.l[n]:[""], lbase="l"+ALL.indexOf(n);
 Ls.forEach(function(L,j){var lid=lbase+"-"+j,a=' data-link="'+esc(n)+'" data-j="'+j+'"';
  h+='<span class="memo link">'+(j===0?'<label for="'+lid+'">링크</label>':'<span class="sp"></span>')+'<input type="text" id="'+lid+'"'+a+' value="'+esc(L)+'" placeholder="'+(j===0?'폴더 경로 또는 주소 붙여넣기':'추가 링크')+'" maxlength="500" autocomplete="off">'+
  (L?'<button class="mini" data-lcopy="'+esc(n)+'" data-j="'+j+'">복사</button>':'')+(Ls.length>1||L?'<button class="mdel" data-ldel="'+esc(n)+'" data-j="'+j+'" aria-label="이 링크 삭제" title="이 링크 삭제">×</button>':'')+'</span>'});
 h+='<button class="madd" data-ladd="'+esc(n)+'">+ 링크 추가</button></span>';
 return h+'</li>';
}
function pctOf(T){var c=counts(T,ALL);return Math.round((c.done+c.na)/c.t*100)}
function render(){
 var T=cur(), c=counts(T,ALL), pct=pctOf(T), sl=saveLabel(), g=GROUPS[ui.g], gc=counts(T,g.i);
 var h='<div class="wrap"><div class="head"><div><h1>서류점검항목 · <span class="tn">'+esc(T.name)+'</span></h1><p class="sub">서류 '+c.t+'개 · 분류 '+GROUPS.length+'개 · 탭 '+S.tabs.length+'개</p></div><div class="save '+sl[0]+'"><i></i><span>'+esc(sl[1])+'</span></div></div>';
 h+='<div class="sum">'+meter(c)+'<div class="stats"><span><span class="pct">'+pct+'%</span>정리됨</span><span>완료 <b>'+c.done+'</b></span><span>보완 필요 <b>'+c.fix+'</b></span><span>해당없음 <b>'+c.na+'</b></span><span>미확인 <b>'+c.none+'</b></span></div></div>';
 h+='<div class="cols"><section class="main" id="main">';
 h+='<div class="mh"><div class="mh-top"><h2>'+(q?'검색 결과':esc(g.n))+'</h2>'+(q?'':'<span class="cnt">'+(gc.done+gc.na)+' / '+gc.t+' 정리</span>')+'</div>';
 h+='<div class="tools"><div class="seg" role="group" aria-label="상태 필터">';
 [["all","전체"],["none","미확인"],["fix","보완"],["done","완료"]].forEach(function(f){h+='<button data-f="'+f[0]+'" aria-pressed="'+(ui.f===f[0])+'">'+f[1]+'</button>'});
 h+='</div><input type="search" id="q" placeholder="전체 서류·비고에서 검색" value="'+esc(q)+'" aria-label="검색"></div></div>';
 var rows='', match=function(n){return ui.f==="all"||(T.s[n]||"none")===ui.f};
 if(q){var ql=q.toLowerCase();GROUPS.forEach(function(G){G.i.forEach(function(n){if((n.toLowerCase().indexOf(ql)>=0||(T.m[n]||[]).join(" ").toLowerCase().indexOf(ql)>=0)&&match(n))rows+=row(T,n,G.n)})})}
 else g.i.forEach(function(n){if(match(n))rows+=row(T,n)});
 h+=rows?'<ul>'+rows+'</ul>':'<div class="empty">'+(q?'"'+esc(q)+'"에 맞는 서류가 없습니다.':'이 분류에 해당 상태의 서류가 없습니다.')+'</div>';
 if(!q){h+='<div class="mf"><button class="nav" data-go="'+(ui.g-1)+'"'+(ui.g===0?' disabled':'')+'>← '+(ui.g>0?esc(GROUPS[ui.g-1].n):'')+'</button><button class="nav" data-go="'+(ui.g+1)+'"'+(ui.g===GROUPS.length-1?' disabled':'')+'>'+(ui.g<GROUPS.length-1?esc(GROUPS[ui.g+1].n):'')+' →</button></div>'}
 h+='</section><nav class="side" aria-label="서류 분류"><h3>분류</h3>';
 GROUPS.forEach(function(G,gi){var k=counts(T,G.i);
  h+='<button class="cat" data-g="'+gi+'" aria-current="'+(!q&&gi===ui.g)+'"><span class="cn">'+esc(G.n)+'</span><span class="cc">'+(k.fix?'<span class="flag">보완 '+k.fix+'</span>':'')+(k.none===0&&k.fix===0?'<span class="fin">끝</span>':'')+(k.done+k.na)+'/'+k.t+'</span>'+meter(k)+'</button>'});
 h+='</nav></div><div class="foot"><span>버튼을 다시 누르면 선택이 해제됩니다. 체크는 1~2초 뒤, 비고는 입력칸을 벗어나면 자동 저장됩니다.</span><button class="btn reset'+(armed==="reset"?' arm':'')+'" id="reset">'+(armed==="reset"?'한 번 더 누르면 이 탭 초기화':'이 탭 초기화')+'</button></div></div>';
 // tab bar
 h+='<div class="tabbar"><div class="tabrow" role="tablist" aria-label="점검 탭">';
 S.tabs.forEach(function(t){h+='<button class="tab" role="tab" data-tab="'+esc(t.id)+'" aria-current="'+(t.id===T.id)+'">'+esc(t.name)+'<small>'+pctOf(t)+'%</small></button>'});
 if(tabForm){h+='<span class="tabform"><input type="text" id="tabname" maxlength="30" placeholder="'+(tabForm==="new"?'새 탭 이름 (예: HACCP)':'바꿀 이름')+'" value="'+(tabForm==="rename"?esc(T.name):'')+'" aria-label="탭 이름"><button class="btn pri" id="tabok">'+(tabForm==="new"?'만들기':'변경')+'</button><button class="btn" id="tabcancel">취소</button></span>'+(tabMsg?'<span class="tabmsg">'+esc(tabMsg)+'</span>':'')}
 else h+='<button class="btn tabedit" id="tabnew">+ 탭 추가</button>';
 h+='<span class="tabact"><button class="btn tabedit" id="tabrename">이름 변경</button>'+(S.tabs.length>1?'<button class="btn tabedit'+(armed==="del"?' arm':'')+'" id="tabdel">'+(armed==="del"?'한 번 더 누르면 "'+esc(T.name)+'" 삭제':'탭 삭제')+'</button>':'')+'</span></div></div>';
 var ae=document.activeElement, fid=ae&&ae.id, pos=0; try{pos=ae.selectionStart}catch(e){}
 document.getElementById("root").innerHTML=h;
 document.body.classList.toggle("ro",mode==="ro");
 if(fid==="q"||fid==="tabname"||/^[ml]\d+-\d+$/.test(fid||"")){var el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
function pick(i){ui.g=i;q="";ls("cl26-ui3",ui);render();
 var m=document.getElementById("main");if(m.getBoundingClientRect().top<0||window.innerWidth<=760)m.scrollIntoView({block:"start",behavior:"smooth"})}
function buildDoc(){
 var css=document.getElementById("css").textContent, js=document.getElementById("app").textContent, st=JSON.stringify(S).replace(/</g,"\\u003c");
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
 '<title>'+esc(document.title)+'</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">\n'+
 '<style id="css">'+css+'</style>\n<div id="root"></div>\n<script type="application/json" id="state">'+st+'<\/script>\n<script id="app">'+js+'<\/script>\n</body></html>';
}
function memoFocused(){var a=document.activeElement;return a&&a.dataset&&(a.dataset.memo!==undefined||a.dataset.link!==undefined)}
function addLink(n,after){var T=cur(),a=T.l[n]&&T.l[n].length?T.l[n]:[""];var at=after<0?a.length:after+1;a.splice(at,0,"");T.l[n]=a;render();
 var el=document.querySelector('input[data-link="'+n.replace(/["\\]/g,"\\$&")+'"][data-j="'+at+'"]');if(el)el.focus()}
function copyText(t,b){var lbl=b.textContent,done=function(ok){b.textContent=ok?"복사됨":"실패";setTimeout(function(){b.textContent=lbl},1500)};
 var fb=function(){try{var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();done(ok)}catch(x){done(false)}};
 try{navigator.clipboard.writeText(t).then(function(){done(true)},fb)}catch(x){fb()}}
function changed(noRender){S.updated=new Date().toISOString();msg="";if(mode!=="ro"&&mode!=="local")mode="dirty";if(mode==="local")ls("cl26-local",S);if(!noRender)render();else{var sv=document.querySelector(".save span");if(sv)sv.textContent=saveLabel()[1]}clearTimeout(timer);timer=setTimeout(save,1500)}
function save(retried){
 if(mode==="local"||mode==="ro"){ls("cl26-local",S);return}
 if(!art||memoFocused()||tabForm){timer=setTimeout(save,1500);return}
 tidy();mode="busy";document.body.classList.add("saving");render();
 try{sessionStorage.setItem("cl26-y",String(window.scrollY));sessionStorage.setItem("cl26-q",q)}catch(e){}
 art.publish(buildDoc()).then(function(){ls("cl26-local",null)},function(e){
  document.body.classList.remove("saving");var code=e&&e.code;
  if(code==="conflict"){mode="ok";msg="다른 사람이 먼저 저장해 최신 내용으로 새로고침합니다";render();return}
  if(code==="upstream_error"&&!retried){setTimeout(function(){save(true)},1500+Math.random()*1500);return}
  if(code==="rate_limited"){mode="dirty";render();timer=setTimeout(save,8000);return}
  if(code==="too_large"||code==="invalid_content"||code==="transform_error"||code==="upstream_error"){mode="local";ls("cl26-local",S);render();return}
  mode="ro";ls("cl26-local",S);render();
 });
}
function arm(k){armed=k;render();setTimeout(function(){if(armed===k){armed=null;render()}},4000)}
function submitTab(){
 var el=document.getElementById("tabname"),name=(el&&el.value||"").trim();
 if(!name){tabMsg="이름을 입력하세요";render();return}
 var dup=S.tabs.some(function(t){return t.name===name&&!(tabForm==="rename"&&t.id===ui.t)});
 if(dup){tabMsg="같은 이름의 탭이 이미 있습니다";render();return}
 if(tabForm==="new"){var t={id:"t"+Date.now().toString(36),name:name,s:{},m:{}};S.tabs.push(t);ui.t=t.id;ls("cl26-ui3",ui)}
 else cur().name=name;
 tabForm=null;tabMsg="";changed();
}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;var T=cur();
 if(b.dataset.item){if(mode==="ro"||mode==="busy")return;var n=b.dataset.item,v=b.dataset.v,P=T.p[n];if(T.s[n]===v)delete T.s[n];else T.s[n]=v;
  if(v==="done"&&P&&P.on)P.c=T.s[n]==="done"?PROCS.slice():[];armed=null;changed();return}
 if(b.dataset.ptog!==undefined){if(mode==="ro"||mode==="busy")return;var pn=b.dataset.ptog,PP=T.p[pn]||{on:false,c:[]};PP.on=!PP.on;if(PP.on&&T.s[pn]==="done")PP.c=PROCS.slice();if(!PP.on&&!PP.c.length)delete T.p[pn];else T.p[pn]=PP;changed();return}
 if(b.dataset.pitem!==undefined){if(mode==="ro"||mode==="busy")return;var In=b.dataset.pitem,pr=b.dataset.proc,Q=T.p[In]||{on:true,c:[]},k=Q.c.indexOf(pr);if(k>=0)Q.c.splice(k,1);else Q.c.push(pr);T.p[In]=Q;
  if(Q.c.length===PROCS.length)T.s[In]="done";else if(T.s[In]==="done")delete T.s[In];changed();return}
 if(b.dataset.lcopy!==undefined){copyText((T.l[b.dataset.lcopy]||[])[+b.dataset.j]||"",b);return}
 if(b.dataset.ladd!==undefined){if(mode==="ro"||mode==="busy")return;addLink(b.dataset.ladd,-1);return}
 if(b.dataset.ldel!==undefined){if(mode==="ro"||mode==="busy")return;var la=(T.l[b.dataset.ldel]||[]).slice();la.splice(+b.dataset.j,1);if(la.length)T.l[b.dataset.ldel]=la;else delete T.l[b.dataset.ldel];changed();return}
 if(b.dataset.madd!==undefined){if(mode==="ro"||mode==="busy")return;addLine(b.dataset.madd,-1);return}
 if(b.dataset.mdel!==undefined){if(mode==="ro"||mode==="busy")return;var a=T.m[b.dataset.mdel]||[];a.splice(+b.dataset.j,1);if(a.length)T.m[b.dataset.mdel]=a;else delete T.m[b.dataset.mdel];changed();return}
 if(b.dataset.f){ui.f=b.dataset.f;ls("cl26-ui3",ui);render();return}
 if(b.dataset.g!==undefined){pick(+b.dataset.g);return}
 if(b.dataset.go!==undefined){pick(+b.dataset.go);return}
 if(b.dataset.tab){ui.t=b.dataset.tab;armed=null;ls("cl26-ui3",ui);render();return}
 if(b.id==="tabnew"||b.id==="tabrename"){if(mode==="ro")return;tabForm=b.id==="tabnew"?"new":"rename";tabMsg="";armed=null;render();var el=document.getElementById("tabname");if(el){el.focus();el.select()}return}
 if(b.id==="tabcancel"){tabForm=null;tabMsg="";render();return}
 if(b.id==="tabok"){submitTab();return}
 if(b.id==="tabdel"){if(armed!=="del"){arm("del");return}armed=null;S.tabs=S.tabs.filter(function(t){return t.id!==T.id});ui.t=S.tabs[0].id;ls("cl26-ui3",ui);changed();return}
 if(b.id==="reset"){if(armed!=="reset"){arm("reset");return}armed=null;T.s={};T.m={};T.p={};T.l={};changed()}
});
document.addEventListener("keydown",function(e){if(e.target.id==="tabname"){if(e.key==="Enter"){e.preventDefault();submitTab()}else if(e.key==="Escape"){tabForm=null;tabMsg="";render()}}
 else if(e.target.dataset&&e.target.dataset.memo!==undefined&&e.key==="Enter"&&!e.isComposing){e.preventDefault();addLine(e.target.dataset.memo,+e.target.dataset.j)}});
function addLine(n,after){var T=cur(),a=T.m[n]&&T.m[n].length?T.m[n]:[""];var at=after<0?a.length:after+1;a.splice(at,0,"");T.m[n]=a;render();
 var el=document.querySelector('input[data-memo="'+n.replace(/["\\]/g,"\\$&")+'"][data-j="'+at+'"]');if(el)el.focus()}
document.addEventListener("input",function(e){
 if(e.target.id==="q"){q=e.target.value.trim();render();return}
 if(e.target.dataset&&e.target.dataset.memo!==undefined){var T=cur(),n=e.target.dataset.memo,j=+e.target.dataset.j,a=T.m[n]&&T.m[n].length?T.m[n]:[""];a[j]=e.target.value;T.m[n]=a;changed(true)}
});
document.addEventListener("change",function(e){var d=e.target.dataset;if(d&&(d.memo!==undefined||d.link!==undefined)){if(d.link!==undefined)render();clearTimeout(timer);timer=setTimeout(save,300)}});
document.addEventListener("input",function(e){var d=e.target.dataset;if(d&&d.link!==undefined){var T=cur(),n=d.link,j=+d.j,a=T.l[n]&&T.l[n].length?T.l[n]:[""];a[j]=e.target.value.trim();T.l[n]=a;changed(true)}});
document.addEventListener("keydown",function(e){var d=e.target.dataset;if(d&&d.link!==undefined&&e.key==="Enter"&&!e.isComposing){e.preventDefault();addLink(d.link,+d.j)}});
try{var sq=sessionStorage.getItem("cl26-q");if(sq!==null){sessionStorage.removeItem("cl26-q");q=sq}}catch(e){}
render();
try{var y=sessionStorage.getItem("cl26-y");if(y){sessionStorage.removeItem("cl26-y");window.scrollTo(0,+y)}}catch(e){}
var use=window.claude&&window.claude.use?window.claude.use("artifact"):Promise.resolve(null);
use.then(function(a){art=a;if(!a){mode="local"}else if(mode==="wait")mode="ok";render()},function(){mode="local";render()});
})();
